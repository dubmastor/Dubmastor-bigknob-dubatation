name: Build DubMastor Big Knob

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/DubKnob_artefacts/Release/VST3/DubMastor Big Knob.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check universal binary + validate with pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="build/DubKnob_artefacts/Release/VST3/DubMastor Big Knob.vst3/Contents/MacOS/DubMastor Big Knob"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 600000 --validate "build/DubKnob_artefacts/Release/VST3/DubMastor Big Knob.vst3"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 600000 --validate "build/DubKnob_artefacts/Release/AU/DubMastor Big Knob.component" || echo "AU: validação pulada (o runner pode não registrar AUs fora da pasta do sistema)"

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp -r "build/DubKnob_artefacts/Release/VST3/DubMastor Big Knob.vst3" out/
          cp "build/DubKnob_artefacts/Release/Standalone/DubMastor Big Knob.exe" out/ || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath DubMastorBigKnob-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubKnob_artefacts/Release/VST3/DubMastor Big Knob.vst3" out/
          cp -R "build/DubKnob_artefacts/Release/AU/DubMastor Big Knob.component" out/
          cp -R "build/DubKnob_artefacts/Release/Standalone/DubMastor Big Knob.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          # ditto preserva permissões e assinatura dentro do zip
          cd out && ditto -c -k --sequesterRsrc . ../DubMastorBigKnob-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DubMastorBigKnob-${{ matrix.name }}
          path: DubMastorBigKnob-${{ matrix.name }}.zip

  release:
    needs: build
    # roda mesmo se uma plataforma falhar: publica só os zips que passaram na validação
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          name: DubMastor Big Knob v2.0 — Dub Station
          files: dist/*.zip
          body: |
            **DubMastor Big Knob — Dub Station (King Tubby tribute)**

            Baixe o arquivo do seu sistema abaixo, em **Assets**:
            - **DubMastorBigKnob-Windows.zip** — VST3 para Cubase no Windows (+ versão standalone .exe)
            - **DubMastorBigKnob-macOS.zip** — VST3 e AU para Mac (+ versão standalone .app)

            Instruções de instalação no README do repositório.
